<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg">
<title>PWR pump symbols</title>
<desc>Vertical reactor coolant pump, horizontal centrifugal, and turbine-driven centrifugal pump symbols. Source-of-truth citations live in plans/svg/pump.md.</desc>

<symbol id="pump-rcp" viewBox="-25 -80 50 160">
<title>Reactor Coolant Pump (1189 rpm, 6.6 kV)</title>
<rect x="-15" y="-78" width="30" height="30" fill="#d6d6d6" stroke="black"/>
<text x="0" y="-58" text-anchor="middle" font-size="6">6.6 kV</text>
<rect x="-20" y="-48" width="40" height="6" fill="#cccccc" stroke="black"/>
<rect x="-12" y="-42" width="24" height="40" fill="#cfcfcf" stroke="black"/>
<text x="0" y="-20" text-anchor="middle" font-size="6">S</text>
<ellipse cx="0" cy="40" rx="22" ry="36" fill="#dcdcdc" stroke="black"/>
<rect x="22" y="36" width="20" height="10" fill="#cccccc" stroke="black"/>
<rect x="-8" y="76" width="16" height="6" fill="#cccccc" stroke="black"/>
<circle id="rcp-anchor-discharge" cx="42" cy="41" r="2" fill="none" stroke="none"/>
<circle id="rcp-anchor-suction" cx="0" cy="82" r="2" fill="none" stroke="none"/>
</symbol>

<symbol id="pump-horizontal" viewBox="-30 -20 60 40">
<title>Horizontal Centrifugal Pump</title>
<circle cx="-5" cy="0" r="14" fill="#dcdcdc" stroke="black"/>
<circle cx="-5" cy="0" r="5" fill="white" stroke="black"/>
<rect x="-12" y="14" width="14" height="8" fill="#cccccc" stroke="black"/>
<rect x="-12" y="-22" width="14" height="8" fill="#cccccc" stroke="black"/>
<rect x="10" y="-8" width="18" height="16" fill="#d6d6d6" stroke="black"/>
<text x="19" y="3" text-anchor="middle" font-size="6">M</text>
<circle id="pump-anchor-suction" cx="-5" cy="22" r="2" fill="none" stroke="none"/>
<circle id="pump-anchor-discharge" cx="-5" cy="-22" r="2" fill="none" stroke="none"/>
</symbol>

<symbol id="pump-turbine" viewBox="-30 -20 60 40">
<title>Turbine-Driven Centrifugal Pump</title>
<circle cx="-5" cy="0" r="14" fill="#dcdcdc" stroke="black"/>
<circle cx="-5" cy="0" r="5" fill="white" stroke="black"/>
<rect x="-12" y="14" width="14" height="8" fill="#cccccc" stroke="black"/>
<rect x="-12" y="-22" width="14" height="8" fill="#cccccc" stroke="black"/>
<circle cx="22" cy="0" r="10" fill="#dcdcdc" stroke="black"/>
<circle cx="22" cy="0" r="3" fill="white" stroke="black"/>
<text x="22" y="2" text-anchor="middle" font-size="6">T</text>
</symbol>

</svg>
