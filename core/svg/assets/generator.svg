<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg">
<title>PWR generator symbols</title>
<desc>Main hydrogen-inner-cooled synchronous generator and brushless exciter symbols. Source-of-truth citations live in plans/svg/generator.md.</desc>

<symbol id="generator-main" viewBox="-110 -70 220 140">
<title>Main Generator (1370 MVA, 24-26 kV, 1800 rpm)</title>
<rect x="-100" y="-50" width="180" height="100" fill="#dcdcdc" stroke="black" stroke-width="1.5"/>
<path d="M -100 -50 Q -110 0 -100 50 Z" fill="#cccccc" stroke="black"/>
<path d="M 80 -50 Q 90 0 80 50 Z" fill="#cccccc" stroke="black"/>
<rect x="-80" y="-20" width="140" height="40" fill="white" stroke="#888" stroke-width="0.8"/>
<rect x="-130" y="-8" width="30" height="16" fill="#aaaaaa" stroke="black"/>
<rect x="80" y="-30" width="30" height="60" fill="#cccccc" stroke="black" stroke-width="1.2"/>
<text x="95" y="-12" text-anchor="middle" font-size="8">EXC</text>
<rect x="-90" y="-65" width="30" height="15" fill="#cfcfcf" stroke="black"/>
<rect x="-50" y="-65" width="30" height="15" fill="#cfcfcf" stroke="black"/>
<rect x="-10" y="-65" width="30" height="15" fill="#cfcfcf" stroke="black"/>
<rect x="30" y="-65" width="30" height="15" fill="#cfcfcf" stroke="black"/>
<text x="-50" y="-70" text-anchor="middle" font-size="6">H₂ coolers</text>
<rect x="20" y="-55" width="20" height="10" fill="#bbbbbb" stroke="black"/>
<rect x="20" y="45" width="20" height="10" fill="#bbbbbb" stroke="black"/>
<circle id="gen-anchor-turbine" cx="-130" cy="0" r="3" fill="none" stroke="none"/>
<circle id="gen-anchor-terminal" cx="40" cy="-55" r="3" fill="none" stroke="none"/>
<circle id="gen-anchor-neutral" cx="40" cy="55" r="3" fill="none" stroke="none"/>
</symbol>

<symbol id="exciter" viewBox="-30 -25 60 50">
<title>Brushless Exciter</title>
<rect x="-22" y="-18" width="44" height="36" fill="#cccccc" stroke="black"/>
<circle cx="0" cy="0" r="10" fill="white" stroke="black"/>
<circle cx="0" cy="0" r="3" fill="#888" stroke="black"/>
<text x="0" y="3" text-anchor="middle" font-size="6">D</text>
<rect x="22" y="-3" width="6" height="6" fill="#aaaaaa" stroke="black"/>
</symbol>

</svg>
