<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg">
<title>PWR circulating and service water symbols</title>
<desc>River intake house, vertical mixed-flow circulating water pump, and essential service water header. Source-of-truth citations live in plans/svg/circulating_water.md.</desc>

<symbol id="river-intake" viewBox="-90 -40 180 80">
<title>River Intake House</title>
<!-- water -->
<path d="M -88 18 q 8 -4 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0" stroke="#4a90d9" stroke-width="1.2" fill="none"/>
<!-- structure -->
<rect x="-70" y="-30" width="140" height="48" fill="#f0f0f0" stroke="black"/>
<line x1="-23" y1="-30" x2="-23" y2="18" stroke="black"/>
<line x1="24" y1="-30" x2="24" y2="18" stroke="black"/>
<!-- bar grill + travelling screen hatch per bay -->
<g stroke="#888" stroke-width="0.7">
<line x1="-62" y1="-6" x2="-32" y2="-6"/>
<line x1="-62" y1="0" x2="-32" y2="0"/>
<line x1="31" y1="-6" x2="61" y2="-6"/>
<line x1="31" y1="0" x2="61" y2="0"/>
</g>
<circle cx="-47" cy="8" r="3" fill="none" stroke="#888"/>
<circle cx="46" cy="8" r="3" fill="none" stroke="#888"/>
<text x="0" y="-14" text-anchor="middle" font-size="7">INTAKE</text>
<circle id="intake-anchor-cw" cx="-47" cy="18" r="2" fill="none" stroke="none"/>
<circle id="intake-anchor-sw" cx="46" cy="18" r="2" fill="none" stroke="none"/>
</symbol>

<symbol id="pump-cw" viewBox="-25 -45 50 90">
<title>Circulating Water Pump</title>
<!-- motor -->
<rect x="-10" y="-40" width="20" height="18" fill="#dcdcdc" stroke="black"/>
<!-- column -->
<rect x="-4" y="-22" width="8" height="28" fill="#cccccc" stroke="black"/>
<!-- volute -->
<circle cx="0" cy="16" r="14" fill="#e6e6e6" stroke="black"/>
<path d="M -14 16 A 14 14 0 0 1 14 16" fill="none" stroke="black"/>
<!-- discharge nozzle -->
<rect x="-20" y="12" width="8" height="8" fill="#cccccc" stroke="black"/>
<circle id="cw-anchor-discharge" cx="-20" cy="16" r="2" fill="none" stroke="none"/>
<circle id="cw-anchor-suction" cx="0" cy="30" r="2" fill="none" stroke="none"/>
</symbol>

<symbol id="sws-train" viewBox="-60 -12 120 24">
<title>Essential Service Water Header</title>
<rect x="-55" y="-6" width="110" height="12" fill="#cccccc" stroke="black"/>
<text x="4" y="3" text-anchor="middle" font-size="7">SWS</text>
<circle cx="-38" cy="0" r="4" fill="white" stroke="black"/>
<circle cx="-24" cy="0" r="4" fill="white" stroke="black"/>
<circle id="sws-anchor-a" cx="-38" cy="0" r="2" fill="none" stroke="none"/>
<circle id="sws-anchor-b" cx="-24" cy="0" r="2" fill="none" stroke="none"/>
</symbol>
</svg>
