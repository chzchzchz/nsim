<ellipse cx="-44" cy="0" rx="6" ry="18" fill="#cccccc" stroke="black"/>
<ellipse cx="44" cy="0" rx="6" ry="18" fill="#cccccc" stroke="black"/>
<g stroke="#888" stroke-width="0.4">
<line x1="-40" y1="-12" x2="40" y2="-12"/>
<line x1="-40" y1="-6" x2="40" y2="-6"/>
<line x1="-40" y1="0" x2="40" y2="0"/>
<line x1="-40" y1="6" x2="40" y2="6"/>
<line x1="-40" y1="12" x2="40" y2="12"/>
</g>
<rect x="-50" y="-10" width="6" height="6" fill="#cccccc" stroke="black"/>
<rect x="44" y="-10" width="6" height="6" fill="#cccccc" stroke="black"/>
<rect x="-6" y="18" width="12" height="6" fill="#cccccc" stroke="black"/>
