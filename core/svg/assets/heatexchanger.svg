<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg">
<title>PWR heat-exchanger symbols</title>
<desc>Horizontal shell-and-tube and vertical U-tube heat-exchanger symbols. Source-of-truth citations live in plans/svg/heatexchanger.md.</desc>

