<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg">
<title>PWR CVCS symbols</title>
<desc>Chemical and volume control system vessels: BTRS demineralizer. Source-of-truth citations live in plans/svg/cvcs.md.</desc>

<symbol id="btrs-demineralizer" viewBox="-25 -40 50 80">
<title>BTRS Demineralizer</title>
<path d="M -18 -34 Q -18 -40 0 -40 Q 18 -40 18 -34" fill="#e6e6e6" stroke="black" stroke-width="1.5"/>
<rect x="-18" y="-34" width="36" height="68" fill="#e6e6e6" stroke="black" stroke-width="1.5"/>
<path d="M -18 34 Q -18 40 0 40 Q 18 40 18 34" fill="#e6e6e6" stroke="black" stroke-width="1.5"/>
<!-- resin bed layers -->
<rect x="-17" y="-20" width="34" height="32" fill="#cccccc" fill-opacity="0.55" stroke="none"/>
<g stroke="#888" stroke-width="0.6">
<line x1="-17" y1="-12" x2="17" y2="-12"/>
<line x1="-17" y1="-4" x2="17" y2="-4"/>
<line x1="-17" y1="4" x2="17" y2="4"/>
</g>
<!-- inlet nozzle, recirculation side -->
<rect x="-24" y="-3" width="6" height="6" fill="#cccccc" stroke="black"/>
