<rect x="-5" y="-39.5" width="10" height="4" fill="#cccccc" stroke="black"/>
<circle id="btrs-anchor-inlet" cx="-24" cy="0" r="2" fill="none" stroke="none"/>
<circle id="btrs-anchor-outlet" cx="0" cy="-44" r="2" fill="none" stroke="none"/>
