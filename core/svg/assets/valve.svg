<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg">
<title>PWR valve symbols</title>
<desc>Gate, swing-check, safety, relief, PORV, stop, and modulating valve symbols for the PWR plant P&ID. Source-of-truth citations live in plans/svg/valve.md.</desc>

<symbol id="valve-gate" viewBox="-36 -24 72 48">
<title>Gate Valve</title>
<polygon points="-34.5,-18 0,0 -34.5,18" fill="white" stroke="black" stroke-width="1.5"/>
<polygon points="34.5,-18 0,0 34.5,18" fill="white" stroke="black" stroke-width="1.5"/>
<rect x="-6" y="-24" width="12" height="48" fill="white" stroke="black" stroke-width="1.5"/>
</symbol>

<symbol id="valve-swing_check" viewBox="-36 -24 72 48">
<title>Swing Check Valve</title>
<line x1="-34.5" y1="-18" x2="34.5" y2="-18" stroke="black" stroke-width="2.5"/>
<circle cx="30" cy="-18" r="3.6" fill="black"/>
<polygon points="-30,15 -6,15 -6,-9" fill="white" stroke="black" stroke-width="1.5"/>
<line x1="-30" y1="15" x2="-6" y2="-9" stroke="black" stroke-width="1.5"/>
</symbol>

<symbol id="valve-safety" viewBox="-36 -30 72 60">
<title>Safety Valve</title>
<polygon points="-34.5,12 0,-6 34.5,12" fill="white" stroke="black" stroke-width="1.5"/>
<line x1="0" y1="-6" x2="0" y2="-25.5" stroke="black" stroke-width="1.5"/>
<path d="M -6 -22.5 L 0 -27.75 L 6 -22.5" fill="none" stroke="black" stroke-width="1.5"/>
<circle cx="0" cy="-24.75" r="3" fill="none" stroke="black" stroke-width="1.5"/>
</symbol>

<symbol id="valve-relief" viewBox="-36 -30 72 60">
<title>Power-Operated Relief Valve</title>
<polygon points="-34.5,12 0,-6 34.5,12" fill="white" stroke="black" stroke-width="1.5"/>
<rect x="-9" y="-27" width="18" height="18" fill="white" stroke="black" stroke-width="1.5"/>
<line x1="0" y1="-9" x2="0" y2="-27" stroke="black" stroke-width="1.5"/>
<text x="18" y="-15" font-size="6">A</text>
</symbol>

<symbol id="valve-porv" viewBox="-36 -30 72 60">
<title>Power-Operated Relief Valve (PORV)</title>
<polygon points="-34.5,12 0,-6 34.5,12" fill="white" stroke="black" stroke-width="1.5"/>
<rect x="-9" y="-27" width="18" height="18" fill="white" stroke="black" stroke-width="1.5"/>
<line x1="0" y1="-9" x2="0" y2="-27" stroke="black" stroke-width="1.5"/>
<text x="18" y="-15" font-size="6">P</text>
</symbol>

<symbol id="valve-stop" viewBox="-36 -30 72 60">
<title>Main Steam Stop Valve</title>
<polygon points="-34.5,12 0,-6 34.5,12" fill="white" stroke="black" stroke-width="1.5"/>
<rect x="-12" y="-27" width="24" height="18" fill="white" stroke="black" stroke-width="1.5"/>
<line x1="0" y1="-9" x2="0" y2="-27" stroke="black" stroke-width="1.5"/>
<circle cx="0" cy="-18" r="4.5" fill="black"/>
</symbol>

<symbol id="valve-modulating" viewBox="-36 -30 72 60">
<title>Modulating Valve</title>
<circle cx="0" cy="0" r="24" fill="white" stroke="black" stroke-width="1.5"/>
<line x1="0" y1="-18" x2="0" y2="-24" stroke="black" stroke-width="1.5"/>
<polygon points="-7.5,-24 7.5,-24 0,-28.5" fill="black"/>
</symbol>
</svg>