<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg">
<title>PWR containment symbols</title>
<desc>Containment building dome, CSS spray ring headers, RCFC fan cooler, CIS isolation, and HDS hydrogen recombiner symbols. Source-of-truth citations live in plans/svg/containment.md.</desc>

<symbol id="containment-dome" viewBox="-200 -200 400 400">
<title>Containment Building</title>
<rect x="-180" y="0" width="360" height="180" fill="#e6e6e6" stroke="black" stroke-width="2"/>
<path d="M -180 0 Q -180 -180 0 -180 Q 180 -180 180 0" fill="#e6e6e6" stroke="black" stroke-width="2"/>
<rect x="-200" y="180" width="400" height="10" fill="#888"/>
<rect x="-200" y="80" width="20" height="40" fill="#bbbbbb" stroke="black"/>
<text x="-190" y="105" text-anchor="middle" font-size="8">PAL</text>
<circle cx="180" cy="100" r="20" fill="#bbbbbb" stroke="black"/>
<text x="180" y="103" text-anchor="middle" font-size="6">EQ</text>
<rect x="-20" y="180" width="40" height="20" fill="#bbbbbb" stroke="black"/>
</symbol>

<symbol id="css-spray-headers" viewBox="-180 -180 360 200">
<title>Containment Spray Ring Headers</title>
<ellipse cx="0" cy="-120" rx="160" ry="20" fill="none" stroke="black" stroke-width="1.5"/>
<g fill="black">
<circle cx="-150" cy="-120" r="2"/>
<circle cx="-100" cy="-128" r="2"/>
<circle cx="-50" cy="-132" r="2"/>
<circle cx="0" cy="-134" r="2"/>
<circle cx="50" cy="-132" r="2"/>
<circle cx="100" cy="-128" r="2"/>
<circle cx="150" cy="-120" r="2"/>
</g>
<text x="0" y="-90" text-anchor="middle" font-size="10">CSS</text>
</symbol>

<symbol id="rcfc-unit" viewBox="-30 -30 60 60">
<title>RCFC Fan Cooler Unit</title>
<rect x="-22" y="-22" width="44" height="44" fill="#dcdcdc" stroke="black"/>
<rect x="-18" y="-18" width="3" height="36" fill="#888"/>
<circle cx="10" cy="0" r="10" fill="#cccccc" stroke="black"/>
<line x1="-22" y1="22" x2="22" y2="22" stroke="black"/>
<text x="0" y="-25" text-anchor="middle" font-size="6">RCFC</text>
</symbol>

<symbol id="cis-isolation" viewBox="-30 -15 60 30">
<title>Containment Isolation (Phase A + B)</title>
<line x1="-25" y1="0" x2="-15" y2="0" stroke="black"/>
<polygon points="-15,-6 -5,0 -15,6" fill="white" stroke="black"/>
<line x1="-5" y1="0" x2="5" y2="0" stroke="black"/>
<polygon points="5,-6 15,0 5,6" fill="white" stroke="black"/>
<line x1="15" y1="0" x2="25" y2="0" stroke="black"/>
<text x="0" y="-10" text-anchor="middle" font-size="6">CIS</text>
</symbol>

<symbol id="containment-sump" viewBox="-30 -20 60 40">
<title>Containment Sump</title>
<rect x="-25" y="-8" width="50" height="24" fill="#e6e6e6" stroke="black" stroke-width="1.5"/>
<rect x="-25" y="-8" width="50" height="8" fill="#a0c8e0"/>
<text x="0" y="12" text-anchor="middle" font-size="7">SUMP</text>
</symbol>

<symbol id="hds-recombiner" viewBox="-25 -25 50 50">
<title>Hydrogen Recombiner</title>
<rect x="-20" y="-20" width="40" height="40" fill="#cfcfcf" stroke="black"/>
<line x1="-15" y1="-15" x2="15" y2="15" stroke="black"/>
<line x1="15" y1="-15" x2="-15" y2="15" stroke="black"/>
<text x="0" y="3" text-anchor="middle" font-size="8">H₂</text>
</symbol>

<symbol id="containment-filter" viewBox="-25 -25 50 50">
<title>Containment Filtration Train</title>
<rect x="-20" y="-20" width="40" height="40" fill="#d5e8d4" stroke="black"/>
<rect x="-16" y="-14" width="8" height="28" fill="white" stroke="black"/>
<rect x="-4" y="-14" width="8" height="28" fill="white" stroke="black"/>
<circle cx="12" cy="0" r="7" fill="white" stroke="black"/>
<path d="M 5 0 a 7 7 0 0 1 14 0 M 12 -7 v 14" stroke="black" fill="none"/>
<text x="0" y="19" text-anchor="middle" font-size="6">FILTER</text>
</symbol>

</svg>
