<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>nsim — PWR P&ID dashboard</title>
    <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
    <header id="sim-bar">
        <span class="sim-logo" title="nsim — pressurized water reactor simulator">👷☢️→🏭→⚡</span>
        <span class="sim-title" title="nsim — pressurized water reactor simulator">nsim · PWR simulator</span>
        <button id="btn-scenario" title="Choose a starting scenario">🧭 Scenario</button>
        <span id="scenario-name" title="Active scenario"></span>
        <button id="btn-start">▶ Start</button>
        <button id="btn-step">⏭ Step</button>
        <button id="btn-reset">↺ Reset</button>
        <label>
            Frames/s
            <input id="fps-input" type="number" min="1" max="240"
                   value="60" size="4" step="1"
                   title="Interface refresh cadence (1-240)" />
        </label>
        <label>
            Steps/s
            <input id="sps-input" type="number" min="0" max="1000000"
                   value="1000" size="7" step="1"
                   title="Simulated milliseconds executed per real second (0-1000000)" />
        </label>
        <span id="sps-indicator" title="Actual plant steps per wall-clock second versus the requested rate at 60 frames/s">steps/s: —</span>
        <button id="btn-copy" aria-label="Copy plant state JSON to clipboard">📋</button>
        <span id="sim-status">loading…</span>
    </header>
    <main>
        <section id="objective" hidden>
            <span class="objective-title"></span>
            <span class="objective-status"></span>
        </section>
        <!-- Static PID structure owned semantically by PidViewport:
             #pid carries the diagram surface; .pid-resize-handle is the
             drag strip. PidViewport may create the handle only as a
             fallback if this sibling is missing. -->
        <div class="pid-wrap">
            <div id="pid" aria-label="P&ID diagram"></div>
            <div class="pid-resize-handle" title="Drag to resize the P&ID pane"></div>
        </div>
        <div id="alarms"></div>
        <div id="tiles"></div>
        <section id="console"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
