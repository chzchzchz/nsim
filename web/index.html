<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>nsim — PWR P&ID dashboard</title>
    <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
    <header id="sim-bar">
        <button id="btn-start">▶ Start</button>
        <button id="btn-step">⏭ Step</button>
        <button id="btn-reset">↺ Reset</button>
        <label>
            Tick rate
            <select id="tick-rate">
                <option value="1">1× (1 ms / frame)</option>
                <option value="16" selected>16× (16 ms / frame)</option>
                <option value="100">100× (100 ms / frame)</option>
                <option value="1000">1000× (1 s / frame)</option>
                <option value="5000">5000× (5 s / frame)</option>
                <option value="10000">10000× (10 s / frame)</option>
            </select>
        </label>
        <span id="sps-indicator" title="Actual plant steps per wall-clock second versus the requested rate at 60 frames/s">steps/s: —</span>
        <button id="btn-copy" aria-label="Copy plant state JSON to clipboard">📋</button>
        <span id="sim-status">loading…</span>
    </header>
    <main>
        <div id="pid"></div>
        <div id="alarms"></div>
        <div id="tiles"></div>
        <section id="console"></section>
    </main>
    <script src="/wasm_exec.js"></script>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
